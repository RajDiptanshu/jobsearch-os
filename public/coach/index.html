<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Interview Coach — JobSearchOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101318'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#08090c; --panel:#101318; --panel-2:#0c0e12; --panel-elev:#141821;
    --line:#20242c; --line-soft:#191d24; --line-bright:#2a2f39;
    --text:#eceff3; --text-dim:#c3cad4; --muted:#828d9c; --muted-2:#5a6472;
    --accent:#10b981; --accent-bright:#34d399; --accent-ink:#04130d; --accent-glow:rgba(16,185,129,.13);
    --gold:#c9a86a; --blue:#5b93d6; --amber:#e0a94b; --red:#e5695f; --violet:#9d8bd6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{margin:0;min-height:100vh;color:var(--text);
    background:radial-gradient(900px 480px at 88% -8%, rgba(16,185,129,.10) 0%, transparent 60%),radial-gradient(700px 420px at 4% 2%, rgba(157,139,214,.05) 0%, transparent 55%),var(--bg);
    font:14.5px/1.6 "Inter","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;letter-spacing:.1px}
  a{color:var(--accent-bright);text-decoration:none} a:hover{color:var(--accent)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#242a33;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .wrap{max-width:1160px;margin:0 auto;padding:22px 22px 60px}
  /* top nav */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 0 18px}
  .logo{display:flex;align-items:center;gap:12px;cursor:pointer}
  .logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--accent) 0%,#0c8f66 100%);display:grid;place-items:center;font-size:20px;box-shadow:0 0 0 1px rgba(52,211,153,.25),0 6px 18px rgba(16,185,129,.22)}
  .logo h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.3px}
  .logo .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .spacer{flex:1}
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav a{font-size:13px;color:var(--text-dim);padding:8px 13px;border-radius:9px;border:1px solid transparent}
  .nav a:hover{background:var(--panel);border-color:var(--line)}
  .nav a.active{background:var(--panel-elev);border-color:var(--line-bright);color:var(--accent-bright)}
  .nav a.ext{color:var(--muted)}
  /* generic */
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  h2.sec{font-size:13px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin:26px 2px 12px;display:flex;align-items:center;gap:9px}
  h2.sec .bar{width:3px;height:15px;border-radius:2px;background:linear-gradient(var(--accent-bright),var(--accent))}
  h2.sec .tag{font-weight:500;text-transform:none;color:var(--muted);font-size:12px;margin-left:auto}
  .btn{background:linear-gradient(140deg,var(--accent-bright),var(--accent));border:0;color:var(--accent-ink);font-weight:700;border-radius:10px;padding:10px 18px;font-size:13.5px;cursor:pointer;box-shadow:0 6px 16px rgba(16,185,129,.20);transition:transform .08s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(16,185,129,.30)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:var(--panel-elev);border:1px solid var(--line-bright);color:var(--text-dim);box-shadow:none}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent-bright)}
  .btn.sm{padding:7px 13px;font-size:12.5px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--text-dim)}
  .chipset{display:flex;gap:7px;flex-wrap:wrap}
  .diff{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:6px}
  .diff.Core,.diff.Easy{background:rgba(16,185,129,.12);color:var(--accent-bright)}
  .diff.Medium,.diff.Regional{background:rgba(224,169,75,.12);color:var(--amber)}
  .diff.Hard,.diff.Advanced{background:rgba(229,105,95,.13);color:var(--red)}
  .diff.Niche{background:rgba(157,139,214,.13);color:var(--violet)}
  #view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--panel-elev);border:1px solid var(--accent);color:var(--accent-bright);padding:11px 17px;border-radius:11px;font-size:13px;display:none;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" onclick="location.hash='#/'">
      <div class="mark">🎓</div>
      <div><h1>PM Interview Coach</h1><div class="sub" id="subline">Practice · Case flows · Daily progress</div></div>
    </div>
    <div class="spacer"></div>
    <nav class="nav" id="nav">
      <a href="#/" data-route="home">Dashboard</a>
      <a href="#/modules" data-route="modules">Modules</a>
      <a href="#/bank" data-route="bank">📚 Question Bank</a>
      <a href="#/practice" data-route="practice">Practice</a>
      <a href="#/history" data-route="history">History</a>
      <a href="#/settings" data-route="settings">Settings</a>
      <a href="/" class="ext" title="Back to job dashboard">↗ Jobs</a>
    </nav>
  </header>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
